name: Libretro cores

on:
  push:
    paths: 'src/libretro/**'
  pull_request:
    paths: 'src/libretro/**'
  workflow_dispatch:

jobs:
  libretro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build linux & win32 cores
        run: |
          sudo apt-get update && sudo apt-get install -y mingw-w64
          cd src/libretro && make
          find . -name "*.o" -delete
          platform=win CC=x86_64-w64-mingw32-gcc CPP=x86_64-w64-mingw32-g++ CXX=x86_64-w64-mingw32-g++ make
      - uses: actions/upload-artifact@v7
        with:
          name: unix-win32
          path: |
            src/libretro/freej2me_plus_libretro.so
            src/libretro/freej2me_plus_libretro.dll

  libretro-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: build macOS core
        run: |
          cd src/libretro && make platform=osx
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            src/libretro/freej2me_plus_libretro.dylib

  package:
    needs: [libretro, libretro-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compute commit short SHA
        id: shortsha
        run: |
          echo "sha_short=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_ENV"
          echo "Build Sha: ${{ env.sha_short }}"
      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          path: cores
          merge-multiple: true
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: freej2me_plus_libretro-${{ env.sha_short }}
          path: cores/
