name: Libretro cores

on:
  push:
    paths: ['src/libretro/**', 'build.xml', '.github/workflows/libretro.yml']
  pull_request:
    paths: ['src/libretro/**', 'build.xml', '.github/workflows/libretro.yml']
  workflow_dispatch:

jobs:
  libretro-linux-win32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build linux & win32 cores
        run: |
          sudo apt-get update && sudo apt-get install -y mingw-w64
          cd src/libretro && make
          find . -name "*.o" -delete
          platform=win CC=x86_64-w64-mingw32-gcc CPP=x86_64-w64-mingw32-g++ CXX=x86_64-w64-mingw32-g++ make
      - name: Compute commit short SHA
        id: shortsha
        run: |
          echo "sha_short=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_ENV"
          echo "Sha: ${{ env.sha_short }}"
      - uses: actions/upload-artifact@v7
        with:
          name: unix-win32-${{ env.sha_short }}
          path: |
            src/libretro/freej2me_plus_libretro.so
            src/libretro/freej2me_plus_libretro.dll

  libretro-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: build macOS core
        run: |
          cd src/libretro && make platform=osx
      - name: Compute commit short SHA
        id: shortsha
        run: |
          echo "sha_short=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_ENV"
          echo "Sha: ${{ env.sha_short }}"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ env.sha_short }}
          path: |
            src/libretro/freej2me_plus_libretro.dylib

  # The Java runtime the cores start FreeJ2ME-Plus with where no Java is
  # installed: "ant build-runtime" (jlink, java.base + java.desktop) for each
  # platform, on that platform's runner, from a JDK that has jmods
  libretro-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-latest }
          - { platform: linux-arm64, os: ubuntu-24.04-arm }
          - { platform: windows-x64, os: windows-latest }
          - { platform: macos-arm64, os: macos-latest }
          - { platform: macos-x64, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: install Ant
        shell: bash
        run: |
          command -v ant && exit 0
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y ant ;;
            macOS) brew install ant ;;
            Windows) choco install ant -y --no-progress ;;
          esac
      - name: build runtime
        shell: bash
        run: |
          # Chocolatey's Ant is not on the path of this shell
          if [ "$RUNNER_OS" = Windows ] && ! command -v ant >/dev/null; then
            PATH="$PATH:$(ls -d /c/ProgramData/chocolatey/lib/ant/tools/apache-ant-*/bin | head -1)"
          fi
          # The jar for Java 8 and later, as upstream builds it; JDK 21 refuses the default 5
          ant build-runtime -Dsource.version=8 -Dtarget.version=8 -Dplatform=${{ matrix.platform }} "-Druntime.jdk.home=$JAVA_HOME"
          ls -la build/freej2me_plus_runtime_*
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.platform }}
          path: build/freej2me_plus_runtime_*

  release-libretro:
    needs: [libretro-linux-win32, libretro-macos, libretro-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download built libretro cores
        uses: actions/download-artifact@v8
        with:
          path: lr-cores
          merge-multiple: true
      - name: Package everything into a zip
        run: |
          mkdir runtimes
          mv lr-cores/freej2me_plus_runtime_* runtimes/
          cd lr-cores
          zip -r ../freej2me_plus_libretro-nightly.zip *
          cd ..
      - name: Send it to the nightly release tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload nightlies freej2me_plus_libretro-nightly.zip runtimes/* --clobber
