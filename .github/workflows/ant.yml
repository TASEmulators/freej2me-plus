name: Java CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up OpenJDK 1.8
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '8'
    - name: Build with Ant
      run: ant -noinput -buildfile build.xml
    - name: Build the Win32Pad exe (Windows Gamepad Support)
      run: |
        sudo apt-get update && sudo apt-get install -y mingw-w64
        mkdir -p build
        i686-w64-mingw32-gcc -Os src/win32pad/Win32Pad.c -o build/Win32Pad.exe -s -nostdlib -ffreestanding -e _main -lkernel32 -lwinmm -Wl,--gc-sections
    - name: Compute commit short SHA
      id: shortsha
      run: |
        echo "sha_short=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_ENV"
        echo "Sha: ${{ env.sha_short }}"
    - uses: actions/upload-artifact@v7
      with:
        name: freej2me_plus-${{ env.sha_short }}
        path: |
          build/*.jar
          build/Win32Pad.exe
    - name: Package nightly into a zip
      run: |
        mkdir -p rel
        cp build/*.jar rel/
        cp build/Win32Pad.exe rel/

        cd rel
        zip -r ../freej2me_plus-nightly.zip *
        cd ..
    - name: Send it to the nightly release tag
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload nightlies freej2me_plus-nightly.zip --clobber
