        <style>
            #mainpage {
                position: relative; /* Ensure positioning for the pseudo-element */
                display: flex;
                flex-wrap: wrap;
                justify-content: space-between;
                color: #222222ff;
                padding: 1%;
                overflow: hidden; /* Hide any overflow from the wave */
            }

            .animbg {
                position: fixed;
                width: 210vw;
                height: 100vh;
                --mask:
                    radial-gradient(4.47vw at 50% 6vw,#000 99%,#0000 101%) calc(50% - 4vw) 0/8vw 100%,
                    radial-gradient(4.47vw at 50% -4vw,#0000 99%,#000 101%) 50% 2vw/8vw 100% repeat-x;
                -webkit-mask: var(--mask);
                        mask: var(--mask);
            }

            #animbg1 {
                top: 88vh;
                background-color: #00000077;
                animation: wave-animation 30s ease-in-out infinite;
                animation-direction: alternate;
                backdrop-filter: blur(4px);
            }

            #animbg2 {
                top: 90vh;
                left: 2vw;
                background-color: #00000077;
                animation: wave-animation 40s ease-in-out infinite;
                animation-direction: alternate-reverse;
            }

            @keyframes wave-animation {
                0% { transform: translateX(-5vw) translateY(-1vh); }
                50% { transform: translateX(-100vw) translateY(3vh); }
                100% { transform: translateX(-5vw) translateY(-1vh); }
            }

            .wave {
                position: absolute;
                top: 50%;
                left: 50%;
                width: 200%;
                height: 200%;

            }

            button {

                margin: 0.5%;
                cursor: pointer;
                background-color: #1e1e1eff;
                color: #007bff;
                border: 4px solid #007bff;
                border-radius: 5px;
                font-weight: bold;
                font-style: italic;
                font-size: calc(min(3vw, 3vh));
                transition: 0.3s;
                box-shadow: 2px 2px 8px black;
            }

            button:hover {
                background-color: #0056b3;
                font-size: calc(min(3.2vw, 3.2vh));
                color: black;
                transform: scale(1.2);
            }
